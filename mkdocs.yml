site_name: Rech (Речь)
site_description: Русский язык программирования - руководство и спецификация
docs_dir: docs
site_dir: site
# Плоские "MANUAL.html" вместо "MANUAL/index.html" (MkDocs-дефолт) - сайт
# не публикуется (см. README.md, "mkdocs build" - только локальная сборка,
# /site в .gitignore), а локальный просмотр без HTTP-сервера (двойной
# клик/переход по UNC-пути) не подхватывает index.html внутри папки сам -
# показывает листинг директории, требуя лишний клик. Плоские файлы решают
# это ценой "красивых" URL (были бы значимы только при реальном хостинге).
use_directory_urls: false
# ROADMAP.md/GRAMMAR_DRAFT.md/MORPHOLOGY_DESIGN.md - внутренние документы
# (история разработки компилятора, черновик ещё не реализованного
# синтаксиса, дизайн internal/morph) - не пользовательская документация
# языка, намеренно не часть этого сайта.
exclude_docs: |
  ROADMAP.md
  GRAMMAR_DRAFT.md
  MORPHOLOGY_DESIGN.md

theme:
  name: material
  language: ru
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Светлая тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.suggest
    - content.code.copy

nav:
  - Главная: index.md
  - Руководство: MANUAL.md
  - Спецификация: SPEC.md
  - Справочник: REFERENCE.md
  - Грамматика: GRAMMAR.md
  - Морфология: MORPHOLOGY.md

markdown_extensions:
  - toc:
      permalink: true
      # slugify по умолчанию (Python-Markdown) отбрасывает кириллицу из id
      # заголовков (получалось "id=1" вместо "id=1-введение-и-философия") -
      # ссылки на разделы внутри MANUAL.md/SPEC.md писались вручную под
      # GitHub-совместимые якоря, uslugify (pymdownx, Unicode-aware) даёт
      # тот же результат.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - fenced_code
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
