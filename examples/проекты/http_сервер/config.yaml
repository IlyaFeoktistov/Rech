# Конфигурация http_сервера - см. исходники/конфигурация.rech
# (Конфигурация::загрузить). TLS-сертификат/ключ - не здесь, а в
# переменных окружения RECH_TLS_CERT/RECH_TLS_KEY (см. package doc
# "создать_слушатель" в сервер.rech) - это секреты, не настройки.
сервер:
  порт: 8080
  # Верхняя граница числа ОДНОВРЕМЕННО обрабатываемых соединений (см.
  # "Семафор", docs/SPEC.md, раздел 15) - соединения сверх этого числа ждут
  # освобождения слота, вместо того чтобы получить ещё один поток ОС без
  # ограничения (docs/ROADMAP.md, "что ещё нужно для настоящего HTTP
  # highload").
  макс_одновременных_соединений: 200
бд:
  строка_подключения: "sqlite::memory:"
логгер:
  путь: сервер.log
