name: Docs image

# Собирает и пушит образ пользовательской документации (MkDocs,
# docs.Dockerfile) в GHCR при мерже в main - отдельно от ci.yml/
# release.yml, т.к. триггер другой (push именно в main, не на каждый PR) и
# только когда меняются файлы самой документации. rechlang-site/kubernetes
# монтируют этот образ под путь "/docs" (см. их README) - см. RELEASING.md.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "docs.Dockerfile"
      - "requirements-docs.txt"

jobs:
  docs-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docs.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rech-docs:latest
            ghcr.io/${{ github.repository_owner }}/rech-docs:${{ github.sha }}
