name: Release

# Только по тегу vX.Y.Z (см. RELEASING.md, "Как выпустить релиз") -
# собирает .deb (make deb) и rech-setup.exe (make windows-installer,
# кросс-сборка через makensis - тот же путь, что уже проверен вручную, см.
# installer/windows/build.sh) и публикует ЧЕРНОВИК GitHub Release с обоими
# файлами - публикация (снятие "черновика") и раздача на сайте, если он
# появится, остаются ручным шагом.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: rech-deb-amd64
          path: dist/*.deb

  windows-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: make windows-installer
      - uses: actions/upload-artifact@v4
        with:
          name: rech-setup-exe
          path: rech-setup.exe

  # Смоук-проверка installer/macos/rech.rb на настоящем macOS-runner'е - до
  # сих пор ни разу не проверялась (нет macOS в разработке). continue-on-
  # error - формула не должна блокировать выпуск .deb/.exe, пока не
  # подтверждена (см. README.md, "Установка" - там же честно помечена как
  # непроверенная).
  macos-formula:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: brew install --HEAD --build-from-source ./installer/macos/rech.rb
      - run: rech version

  release:
    needs: [deb, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Черновик GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/rech-deb-amd64/*.deb
            artifacts/rech-setup-exe/rech-setup.exe
